name: CI

# The code half of the definition-of-done gate, on every push to `main` and every pull request:
# ESLint (with the package boundaries of the headless core and the Angular template rules), Stylelint, the
# Prettier check, `tsc -b` with the app's templates through `ngc`, and the Vitest suite; then the app's
# end-to-end scenarios in Chromium. The steps run in the order a failure is cheapest to read. The Markdown half runs in
# markdown-lint.yml, so `npm run lint` is covered by the two workflows together without linting anything
# twice.
#
# No path filter, on purpose: a config, the lockfile or a tsconfig can break the gate without touching code.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-code:
    name: eslint, stylelint, prettier, tsc, vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Node line from .nvmrc (24); every tool is an exact devDependency pinned by the lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run --silent lint:es

      - name: Stylelint
        run: npm run --silent lint:css

      - name: Prettier
        run: npm run --silent format:check

      - name: Typecheck
        run: npm run --silent typecheck

      - name: Test
        run: npm test

  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The scenarios run the real CLI against the built packages and serve the built app.
      - name: Build
        run: npm run build

      # Only Chromium: the app is checked in one engine, and the browser comes from Playwright's own pinned
      # build rather than whatever the runner has.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e
