name: Content lint

# The gate from AGENTS.md: every topic, card, summary and package must pass the content preset of
# wastech-mdlint (front matter, required sections, size budgets, links and images, no yes/no questions,
# no template tokens), and every committed diagram SVG must match its .mmd source. Both reports go into
# the job summary.
#
# No path filter, on purpose: a config or preset change can break files that did not change.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: wastech-mdlint + diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # wastech-mdlint needs Node >= 24.17; scripts/render-diagrams.mjs uses fs.globSync (Node 22+).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint content
        run: |
          status=0
          npm run --silent lint > "$RUNNER_TEMP/mdlint.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/mdlint.txt"
          {
            echo "## Content lint — wastech-mdlint $(npx --no-install wastech-mdlint --version)"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/mdlint.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # `--check` only hashes the .mmd sources and compares them with the marker in each SVG; it renders
      # nothing, so no browser is needed here. A stale SVG means `npm run render:diagrams` was skipped.
      - name: Diagram SVGs are up to date
        run: |
          status=0
          npm run --silent render:diagrams -- --check > "$RUNNER_TEMP/diagrams.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/diagrams.txt"
          {
            echo "## Diagrams"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/diagrams.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
